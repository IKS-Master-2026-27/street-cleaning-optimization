[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "street-cleaning-instancelab"
version = "0.1.0"
description = "Instance Space Analysis foundations for CLIPP street-cleaning instances"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tringa" }]
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "plotly>=5.24,<7",
    "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
